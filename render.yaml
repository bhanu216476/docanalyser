services:
  - type: web
    name: docanalyser-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RAG_SERVICE_URL
        value: http://docanalyser-rag:8000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docanalyser-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docanalyser-redis
          property: connectionString

  - type: web
    name: docanalyser-rag
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: ./rag-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: docanalyser-redis
          property: connectionString

  - type: web
    name: docanalyser-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://docanalyser-backend.onrender.com

  - type: redis
    name: docanalyser-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: docanalyser-postgres
    databaseName: docanalyser
    user: docanalyser_user
    region: oregon
    plan: free
    ipAllowList: []
