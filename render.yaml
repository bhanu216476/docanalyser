services:
  - type: web
    name: docanalyser-n8n
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: ./infrastructure/n8n
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: docanalyser-shared-secrets
      - key: N8N_PORT
        value: "5678"
      - key: PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: docanalyser-n8n.onrender.com
      - key: WEBHOOK_URL
        value: https://docanalyser-n8n.onrender.com
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: docanalyser-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: docanalyser-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: docanalyser-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: docanalyser-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: docanalyser-postgres
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: SPRING_BOOT_URL
        value: https://docanalyser-backend.onrender.com
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: ""
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_LOG_LEVEL
        value: info

  - type: web
    name: docanalyser-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: docanalyser-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RAG_SERVICE_URL
        value: https://docanalyser-rag.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docanalyser-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docanalyser-redis
          property: connectionString

  - type: web
    name: docanalyser-rag
    env: docker
    region: oregon
    plan: free
    branch: main
    rootDir: ./rag-service
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: docanalyser-shared-secrets
      - key: PORT
        value: "8000"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: docanalyser-redis
          property: connectionString

  - type: web
    name: docanalyser-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://docanalyser-backend.onrender.com
      - key: VITE_RAG_URL
        value: https://docanalyser-rag.onrender.com

  - type: redis
    name: docanalyser-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: docanalyser-postgres
    databaseName: docanalyser
    user: docanalyser_user
    region: oregon
    plan: free
    ipAllowList: []

envVarGroups:
  - name: docanalyser-shared-secrets
    envVars:
      - key: N8N_INGESTION_TOKEN
        generateValue: true
