spring:
  application:
    name: spring-boot-service-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-32chars
    expiration-ms: 3600000
  rag-service:
    url: http://localhost:8000
    connect-timeout-ms: 1000
    read-timeout-ms: 5000
  internal:
    api-token: test-internal-token
  redis:
    cache-document-ttl-seconds: 300
    session-state-ttl-seconds: 1800
    job-status-ttl-seconds: 86400
