global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'docanalyser-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'docanalyser-rag-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['rag-service:8000']

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['otel-collector:8888']
