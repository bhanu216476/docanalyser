version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: placeholder_user
      POSTGRES_PASSWORD: placeholder_password
      POSTGRES_DB: docanalyser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
