# ==============================================================================
# Deployment Pipeline
# ==============================================================================
#
# Responsibilities:
#   - Deploy the application to the production environment.
#   - Wait for Docker Build and Publish workflow to complete successfully.
#   - Require environment protection rules (approvals).
#   - Perform post-deployment health checks.
#
# Suggested workflow: .github/workflows/deploy.yml
# ==============================================================================

name: Deployment

on:
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        id: check-config
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "Deployment credentials not configured. Skipping actual deployment."
            echo "DEPLOY_READY=false" >> $GITHUB_ENV
          else
            echo "Deployment credentials found."
            echo "DEPLOY_READY=true" >> $GITHUB_ENV
          fi

      - name: Deploy application
        if: env.DEPLOY_READY == 'true'
        run: |
          echo "Simulating deployment steps using Docker Compose..."
          # Example: ssh user@host "cd /opt/docanalyser && docker compose pull && docker compose up -d"
          echo "Deployment successful."

      - name: Post-deployment health check
        if: env.DEPLOY_READY == 'true'
        run: |
          echo "Checking application health..."
          # Example: curl -f http://production.url/api/health || exit 1
          echo "Health check passed."

      - name: Deployment unconfigured summary
        if: env.DEPLOY_READY == 'false'
        run: |
          echo "## Deployment Blocked :warning:" >> $GITHUB_STEP_SUMMARY
          echo "Deployment infrastructure and secrets are not configured." >> $GITHUB_STEP_SUMMARY
          echo "To enable deployment, configure the \`DEPLOY_SSH_KEY\` secret." >> $GITHUB_STEP_SUMMARY
